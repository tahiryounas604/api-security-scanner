[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-security-scanner"
version = "0.1.0"
description = "Async API security scanner: broken auth, BOLA/IDOR, rate limiting, verbose errors, security headers, dangerous HTTP methods."
readme = "README.md"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Tahir Younas" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
apisec-scan = "api_security_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
